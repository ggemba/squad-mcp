# hardcoded-secrets — bundled inventory pack v1.
#
# Detects hardcoded credentials in source and config — AWS access keys, PEM
# private-key blocks, GitHub / Slack / Google API tokens, and secret-named
# variables assigned a string literal. Use to build a remediation inventory
# before rotating credentials or wiring up a proper secrets manager.
#
# Threat-model note: this is a security-adjacent pack and findings are
# CANDIDATES, not confirmed leaks. The structural rules (AWS / PEM / token
# prefixes) are high-signal, but false positives are EXPECTED on test
# fixtures, example configs, and documentation that embeds sample keys. The
# generic-assignment rule in particular over-fires on env-var names and
# placeholders. Treat this pack as a triage aid: it narrows where a human (or
# the semantic tier) must look — it does not adjudicate.
#
# Language-agnostic: secrets hide in source AND in config files, so the file
# patterns cover both. No cross_ref section — a hardcoded secret has no
# framework relationship to resolve, so Phase 3 is skipped for this pack.

name: hardcoded-secrets
version: 1
description: Inventory of hardcoded secrets — AWS keys, PEM private keys, GitHub/Slack/Google tokens, secret-named literal assignments.
language: "multi"

# Explicit patterns are required: `language: "multi"` has no single file
# extension, so no default glob can be derived — the file types to scan must
# be enumerated here explicitly. Source extensions match the other agnostic
# packs; config extensions (.env / .yaml / .json / .properties / .toml) are
# added because secrets hide in config at least as often as in code.
file_patterns:
  - "**/*.js"
  - "**/*.jsx"
  - "**/*.ts"
  - "**/*.tsx"
  - "**/*.py"
  - "**/*.go"
  - "**/*.rb"
  - "**/*.java"
  - "**/*.kt"
  - "**/*.php"
  - "**/*.rs"
  - "**/*.cs"
  - "**/*.swift"
  - "**/*.scala"
  - "**/*.c"
  - "**/*.cpp"
  - "**/*.h"
  - "**/*.env"
  # `**/*.env` does not cover the conventional bare `.env` dotfile or its
  # `.env.local` / `.env.production` variants — those are named `.env`, not
  # `something.env`. Enumerate them explicitly so config secrets are scanned.
  - "**/.env"
  - "**/.env.*"
  - "**/*.yaml"
  - "**/*.yml"
  - "**/*.json"
  - "**/*.properties"
  - "**/*.toml"

# Lockfiles and example/sample configs are excluded on top of the usual
# build/vendor excludes — example and sample files exist to carry placeholder
# credentials, so flagging them is pure noise.
exclude_patterns:
  - "node_modules/**"
  - "vendor/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/*.min.*"
  - ".git/**"
  - "**/*.lock"
  - "**/*.example"
  - "**/*.sample"

rules:
  # AWS access key id — the `AKIA` (long-term) / `ASIA` (temporary) prefix
  # plus 16 uppercase-alphanumeric chars is a fixed structural shape. High
  # signal; `\b` anchors keep it off longer tokens.
  - id: secret-aws-access-key
    severity: warning
    category: secret
    requires_semantic: false
    description: AWS access key id — AKIA/ASIA prefix followed by 16 uppercase-alphanumeric characters.
    regex: '\b(AKIA|ASIA)[0-9A-Z]{16}\b'
    summary_hint: "Candidate AWS access key — confirm it is live and rotate it; move to a secrets manager."

  # PEM private-key header — the `-----BEGIN ... PRIVATE KEY-----` armor is
  # an unambiguous marker that a private key is embedded in the file.
  - id: secret-pem-private-key
    severity: warning
    category: secret
    requires_semantic: false
    description: PEM-encoded private key block embedded inline in source or config.
    regex: "-----BEGIN [A-Z ]*PRIVATE KEY-----"
    summary_hint: "Inline private key — keys must never live in the repo; rotate and externalize."

  # GitHub token — the `ghp_` / `gho_` / `ghu_` / `ghs_` / `ghr_` prefixes
  # plus 36+ base62 chars. Structural and high-signal.
  - id: secret-gh-token
    severity: warning
    category: secret
    requires_semantic: false
    description: GitHub personal-access / OAuth / app token — gh[posru]_ prefix with a 36+ char body.
    regex: '\bgh[posru]_[0-9A-Za-z]{36,}\b'
    summary_hint: "Candidate GitHub token — confirm it is live and revoke it from the token settings page."

  # Slack token — the `xoxb` / `xoxa` / `xoxp` / `xoxr` / `xoxs` prefixes
  # plus a hyphenated body. Structural and high-signal.
  - id: secret-slack-token
    severity: warning
    category: secret
    requires_semantic: false
    description: Slack API token — xox[baprs]- prefix followed by a hyphenated token body.
    regex: '\bxox[baprs]-[0-9A-Za-z-]{10,}'
    summary_hint: "Candidate Slack token — confirm it is live and revoke it from the Slack app settings."

  # Google API key — the `AIza` prefix plus 35 base64url chars is the fixed
  # shape Google issues. High signal; `\b` anchors the boundary.
  - id: secret-google-api-key
    severity: warning
    category: secret
    requires_semantic: false
    description: Google API key — AIza prefix followed by 35 base64url characters.
    regex: '\bAIza[0-9A-Za-z_-]{35}\b'
    summary_hint: "Candidate Google API key — confirm it is live, restrict or rotate it in the GCP console."

  # A secret-named variable assigned a non-empty string literal — e.g.
  # `api_key = "s3cr3t-value"`. This catches generic credentials the
  # structural rules miss, but it over-fires badly: a placeholder, an
  # env-var NAME, or a test fixture all match. Only a model reading local
  # context can judge real-secret vs noise, so this MUST escalate to the
  # semantic tier.
  - id: secret-generic-assignment
    severity: warning
    category: secret
    requires_semantic: true
    description: Secret-named variable assigned a non-empty string literal — potential hardcoded credential.
    regex: '(?i)\b(api[_-]?key|secret|passwd|password|token|access[_-]?key)\b\s*[:=]\s*[''"][^''"]{8,}[''"]'
    summary_hint: "Secret-named assignment — check whether the literal is a real credential or a placeholder/env-var name."
